<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f2eb">
    <meta name="description" content="Shape a rough coding request into a clear, reusable brief.">
    <title>Context Kit — Coding brief builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Context Kit home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>context kit</span>
      </a>
      <div class="local-indicator"><span></span> PRIVATE BY DESIGN</div>
    </header>

    <main class="workspace">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span>FIELD NOTES</span><span>NO. 001</span></div>
        <h1 id="page-title">Make the ask<br><em>make sense.</em></h1>
        <p class="intro-note">A good brief leaves room for good work.</p>
      </section>

      <section class="builder" aria-label="Coding brief builder">
        <div class="form-panel">
          <div class="panel-heading">
            <div><span class="step">01</span><h2>The brief</h2></div>
            <button class="text-button" id="example-button" type="button">Load example <span aria-hidden="true">↗</span></button>
          </div>

          <form id="brief-form">
            <label for="task">What needs to happen?</label>
            <textarea id="task" name="task" rows="3" placeholder="Describe the change or outcome..."></textarea>

            <label for="context">Useful context <span class="optional">OPTIONAL</span></label>
            <textarea id="context" name="context" rows="3" placeholder="Relevant files, behavior, or background..."></textarea>

            <label for="constraints">Constraints <span class="optional">ONE PER LINE</span></label>
            <textarea id="constraints" name="constraints" rows="3" placeholder="Keep the existing API stable&#10;Avoid adding dependencies"></textarea>

            <label for="checks">How will you know it worked? <span class="optional">ONE PER LINE</span></label>
            <textarea id="checks" name="checks" rows="3" placeholder="The focused tests pass&#10;The empty state is handled"></textarea>
          </form>
        </div>

        <div class="preview-panel">
          <div class="panel-heading preview-heading">
            <div><span class="step">02</span><h2>Preview</h2></div>
            <span class="format-label">MARKDOWN</span>
          </div>
          <pre id="preview" class="preview" aria-live="polite"><span class="empty-preview">Your brief will take shape here.</span></pre>
          <div class="preview-footer">
            <span id="word-count" class="word-count">0 WORDS</span>
            <div class="actions">
              <button class="icon-button" id="clear-button" type="button" aria-label="Clear all fields" title="Clear all fields">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
              </button>
              <button class="copy-button" id="copy-button" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
                <span>Copy brief</span>
              </button>
            </div>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <footer class="page-footer"><span>CONTEXT KIT</span><span>MADE FOR THE MOMENT BEFORE THE CODE</span></footer>
    </main>
  </body>
</html>
